<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Demo — Nube de puntos animada (WebGL shader)</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; }
  .hint {
    position: fixed; bottom: 16px; left: 0; right: 0;
    text-align: center; color: rgba(255,255,255,.35);
    font: 12px/1.4 -apple-system, system-ui, sans-serif;
    letter-spacing: .08em; text-transform: uppercase;
    pointer-events: none;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="hint">mueve el mouse · webgl vertex shader · 0 dependencias</div>

<script>
'use strict';

// ---------- Shaders ----------

const VERT = `
precision highp float;

attribute vec3 aDir;      // direccion unitaria sobre la esfera
uniform float uTime;
uniform vec2  uMouse;     // -1..1
uniform mat4  uProj;
uniform float uPixelRatio;

varying float vNoise;
varying float vDepth;

// --- Simplex noise 3D (Ashima / Ian McEwan, MIT) ---
vec3 mod289(vec3 x){ return x - floor(x * (1.0/289.0)) * 289.0; }
vec4 mod289(vec4 x){ return x - floor(x * (1.0/289.0)) * 289.0; }
vec4 permute(vec4 x){ return mod289(((x*34.0)+1.0)*x); }
vec4 taylorInvSqrt(vec4 r){ return 1.79284291400159 - 0.85373472095314 * r; }

float snoise(vec3 v){
  const vec2 C = vec2(1.0/6.0, 1.0/3.0);
  const vec4 D = vec4(0.0, 0.5, 1.0, 2.0);
  vec3 i  = floor(v + dot(v, C.yyy));
  vec3 x0 = v - i + dot(i, C.xxx);
  vec3 g = step(x0.yzx, x0.xyz);
  vec3 l = 1.0 - g;
  vec3 i1 = min(g.xyz, l.zxy);
  vec3 i2 = max(g.xyz, l.zxy);
  vec3 x1 = x0 - i1 + C.xxx;
  vec3 x2 = x0 - i2 + C.yyy;
  vec3 x3 = x0 - D.yyy;
  i = mod289(i);
  vec4 p = permute(permute(permute(
            i.z + vec4(0.0, i1.z, i2.z, 1.0))
          + i.y + vec4(0.0, i1.y, i2.y, 1.0))
          + i.x + vec4(0.0, i1.x, i2.x, 1.0));
  float n_ = 0.142857142857;
  vec3 ns = n_ * D.wyz - D.xzx;
  vec4 j = p - 49.0 * floor(p * ns.z * ns.z);
  vec4 x_ = floor(j * ns.z);
  vec4 y_ = floor(j - 7.0 * x_);
  vec4 x = x_ * ns.x + ns.yyyy;
  vec4 y = y_ * ns.x + ns.yyyy;
  vec4 h = 1.0 - abs(x) - abs(y);
  vec4 b0 = vec4(x.xy, y.xy);
  vec4 b1 = vec4(x.zw, y.zw);
  vec4 s0 = floor(b0)*2.0 + 1.0;
  vec4 s1 = floor(b1)*2.0 + 1.0;
  vec4 sh = -step(h, vec4(0.0));
  vec4 a0 = b0.xzyw + s0.xzyw*sh.xxyy;
  vec4 a1 = b1.xzyw + s1.xzyw*sh.zzww;
  vec3 p0 = vec3(a0.xy, h.x);
  vec3 p1 = vec3(a0.zw, h.y);
  vec3 p2 = vec3(a1.xy, h.z);
  vec3 p3 = vec3(a1.zw, h.w);
  vec4 norm = taylorInvSqrt(vec4(dot(p0,p0), dot(p1,p1), dot(p2,p2), dot(p3,p3)));
  p0 *= norm.x; p1 *= norm.y; p2 *= norm.z; p3 *= norm.w;
  vec4 m = max(0.6 - vec4(dot(x0,x0), dot(x1,x1), dot(x2,x2), dot(x3,x3)), 0.0);
  m = m * m;
  return 42.0 * dot(m*m, vec4(dot(p0,x0), dot(p1,x1), dot(p2,x2), dot(p3,x3)));
}

// fbm: 3 octavas de ruido para crestas organicas
float fbm(vec3 p){
  float f = 0.0;
  f += 0.5000 * snoise(p);
  f += 0.2500 * snoise(p * 2.0);
  f += 0.1250 * snoise(p * 4.0);
  return f / 0.875;
}

mat3 rotY(float a){
  float c = cos(a), s = sin(a);
  return mat3(c,0.,-s, 0.,1.,0., s,0.,c);
}
mat3 rotX(float a){
  float c = cos(a), s = sin(a);
  return mat3(1.,0.,0., 0.,c,s, 0.,-s,c);
}

void main(){
  float t = uTime * 0.12;

  // --- ligera variacion por zonas ---
  // un ruido muy lento y de baja frecuencia da pequenas diferencias
  // de fase/velocidad por region, sin romper la forma general
  vec3 region = aDir * 0.7;
  float vPhase = fbm(region + 42.7);          // -1..1
  float vSpeed = fbm(region + 11.3);          // -1..1

  float speed  = 0.12 * (1.0 + vSpeed * 0.10); // +-10% de velocidad segun zona
  float phase  = vPhase * 0.7;                 // desfase muy suave

  float ts = uTime * speed;

  // campo de ruido base coherente + un desfase leve por region
  float n = fbm(aDir * 1.6 + vec3(ts, ts * 0.7, -ts * 0.5) + phase);
  vNoise = n;

  // pulso global suave y comun a toda la forma (respiracion pareja)
  float breathe = sin(uTime * 0.5) * 0.06;

  // desplazamiento radial: crestas empujan hacia afuera
  float disp = n * 0.42 + breathe;
  float r = 1.0 + disp;
  vec3 pos = aDir * r;

  // rotacion lenta + parallax con el mouse
  pos = rotY(uTime * 0.08 + uMouse.x * 0.55) * rotX(uMouse.y * 0.35 + sin(uTime*0.05)*0.1) * pos;

  vec4 mv = vec4(pos.xy, pos.z - 3.1, 1.0);
  gl_Position = uProj * mv;

  vDepth = smoothstep(-4.6, -1.8, mv.z);

  // puntos mas grandes en crestas y mas cerca de camara
  float size = (1.4 + n * 2.2) * uPixelRatio;
  gl_PointSize = size * (3.4 / -mv.z) * 1.6;
}
`;

const FRAG = `
precision highp float;

varying float vNoise;
varying float vDepth;

void main(){
  // disco suave (descarta esquinas del point sprite)
  vec2 uv = gl_PointCoord - 0.5;
  float d = length(uv);
  float alpha = smoothstep(0.5, 0.32, d);
  if (alpha < 0.01) discard;

  // paleta: valles azul/violeta -> crestas naranja/rojo (como la referencia)
  vec3 deep   = vec3(0.16, 0.10, 0.85);  // azul
  vec3 mid    = vec3(0.80, 0.15, 0.55);  // magenta
  vec3 hot    = vec3(1.00, 0.45, 0.10);  // naranja
  vec3 peak   = vec3(1.00, 0.80, 0.35);  // amarillo claro

  float k = clamp(vNoise * 0.5 + 0.5, 0.0, 1.0);
  vec3 col = mix(deep, mid, smoothstep(0.15, 0.45, k));
  col      = mix(col,  hot, smoothstep(0.45, 0.72, k));
  col      = mix(col,  peak, smoothstep(0.80, 0.98, k));

  // atenua lo que queda atras para dar profundidad
  col *= mix(0.25, 1.0, vDepth);

  gl_FragColor = vec4(col, alpha * mix(0.35, 1.0, vDepth));
}
`;

// ---------- Setup WebGL ----------

const canvas = document.getElementById('c');
const gl = canvas.getContext('webgl', { antialias: true, alpha: false });

function compile(type, src){
  const s = gl.createShader(type);
  gl.shaderSource(s, src);
  gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS))
    throw new Error(gl.getShaderInfoLog(s));
  return s;
}

const prog = gl.createProgram();
gl.attachShader(prog, compile(gl.VERTEX_SHADER, VERT));
gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, FRAG));
gl.linkProgram(prog);
if (!gl.getProgramParameter(prog, gl.LINK_STATUS))
  throw new Error(gl.getProgramInfoLog(prog));
gl.useProgram(prog);

// ---------- Geometria: rejilla lat/long sobre esfera ----------
// (la rejilla da ese look de "filas de puntos" de la referencia)

const LAT = 160, LON = 260;
const dirs = new Float32Array(LAT * LON * 3);
let ptr = 0;
for (let i = 0; i < LAT; i++){
  const phi = (i + 0.5) / LAT * Math.PI;          // 0..PI
  for (let j = 0; j < LON; j++){
    const theta = j / LON * Math.PI * 2.0;        // 0..2PI
    dirs[ptr++] = Math.sin(phi) * Math.cos(theta);
    dirs[ptr++] = Math.cos(phi);
    dirs[ptr++] = Math.sin(phi) * Math.sin(theta);
  }
}
const COUNT = LAT * LON;

const buf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, buf);
gl.bufferData(gl.ARRAY_BUFFER, dirs, gl.STATIC_DRAW);
const locDir = gl.getAttribLocation(prog, 'aDir');
gl.enableVertexAttribArray(locDir);
gl.vertexAttribPointer(locDir, 3, gl.FLOAT, false, 0, 0);

// ---------- Uniforms ----------

const uTime  = gl.getUniformLocation(prog, 'uTime');
const uMouse = gl.getUniformLocation(prog, 'uMouse');
const uProj  = gl.getUniformLocation(prog, 'uProj');
const uPR    = gl.getUniformLocation(prog, 'uPixelRatio');

function perspective(fovy, aspect, near, far){
  const f = 1 / Math.tan(fovy / 2), nf = 1 / (near - far);
  return new Float32Array([
    f/aspect,0,0,0,
    0,f,0,0,
    0,0,(far+near)*nf,-1,
    0,0,2*far*near*nf,0
  ]);
}

function resize(){
  const pr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width  = Math.floor(innerWidth * pr);
  canvas.height = Math.floor(innerHeight * pr);
  gl.viewport(0, 0, canvas.width, canvas.height);
  gl.uniformMatrix4fv(uProj, false, perspective(0.9, canvas.width / canvas.height, 0.1, 20));
  gl.uniform1f(uPR, pr);
}
addEventListener('resize', resize);
resize();

// mouse con easing para parallax suave
let mx = 0, my = 0, tx = 0, ty = 0;
addEventListener('pointermove', e => {
  tx = (e.clientX / innerWidth)  * 2 - 1;
  ty = (e.clientY / innerHeight) * 2 - 1;
});

// blending aditivo: los puntos brillan al superponerse
gl.enable(gl.BLEND);
gl.blendFunc(gl.SRC_ALPHA, gl.ONE);
gl.disable(gl.DEPTH_TEST);
gl.clearColor(0, 0, 0, 1);

// ---------- Loop ----------

const t0 = performance.now();
function frame(now){
  mx += (tx - mx) * 0.04;
  my += (ty - my) * 0.04;

  gl.uniform1f(uTime, (now - t0) / 1000);
  gl.uniform2f(uMouse, mx, my);

  gl.clear(gl.COLOR_BUFFER_BIT);
  gl.drawArrays(gl.POINTS, 0, COUNT);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
